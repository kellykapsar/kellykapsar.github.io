name: Render and publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      # v5 runs on Node 24. v4 still works but emits a deprecation warning
      # on every run.
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # No version pin: always installs the current Quarto release. Pinning
      # to a version that has been removed causes the setup step to fail.
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # If you later add R code chunks to any .qmd, uncomment these two blocks.
      # - name: Set up R
      #   uses: r-lib/actions/setup-r@v2
      # - name: Install R packages
      #   uses: r-lib/actions/setup-renv@v2

      - name: Render and publish to gh-pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
